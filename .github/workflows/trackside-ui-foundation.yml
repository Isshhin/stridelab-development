name: Trackside UI foundation checks

on:
  push:
    branches:
      - feature/trackside3-compose-foundation-20261102
      - design/trackside3-figma-parity-no-build-20261103
    paths:
      - 'native-android/**'
      - '.github/workflows/trackside-ui-foundation.yml'
  pull_request:
    branches:
      - integration/native-pre-trackside3-verified-20261030
    paths:
      - 'native-android/**'
      - '.github/workflows/trackside-ui-foundation.yml'

permissions:
  contents: read

jobs:
  native-theme-and-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Trackside UI and run native unit tests
        working-directory: native-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Validate exercise library compatibility
        run: python3 native-android/tools/validate_exercise_library.py
