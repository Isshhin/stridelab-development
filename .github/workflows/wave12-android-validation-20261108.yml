name: StrideLab Wave 1-2 isolated Android verification

on:
  push:
    branches:
      - fix/plan-builder-training-wave12-20261108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave12-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run JVM regression suite and compile debug APK
        working-directory: native-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
