name: Exercise Library 2.0 cloud verification
on:
  push:
    branches: ['feature/exercise-library-v2-cloud-20261029']
  pull_request:
    paths: ['native-android/**', '.github/workflows/exercise-library-v2.yml']
permissions:
  contents: read
jobs:
  offline-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m pip install jsonschema==4.26.0
      - run: python3 native-android/tools/validate_exercise_library.py
      - run: python3 -m unittest discover -s native-android/tools/tests -v
      - run: python3 native-android/tools/run_library_jvm_checks.py
      - name: Re-run JVM checks with cached dependencies and no downloads
        run: python3 native-android/tools/run_library_jvm_checks.py --offline
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon --stacktrace -p native-android :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exercise-library-unit-reports-${{ github.sha }}
          path: |
            native-android/app/build/test-results/
            native-android/app/build/reports/tests/
          if-no-files-found: warn
