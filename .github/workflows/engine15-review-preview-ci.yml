name: Engine 1.5 Trackside UI candidate - compile only

on:
  push:
    branches:
      - feature/engine15-trackside-e3-ui-candidate-20261103
    paths:
      - 'native-android/**'
      - '.github/workflows/engine15-review-preview-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine15-review-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source-integrity and Python regression gates
        run: |
          python3 -m pip install jsonschema==4.26.0
          python3 native-android/tools/validate_exercise_library.py
          python3 -m unittest discover -s native-android/tools/tests -v
      - name: Compile and execute all pinned pure Kotlin + Java JUnit tests
        run: |
          python3 native-android/tools/run_library_jvm_checks.py
          python3 native-android/tools/run_library_jvm_checks.py --offline

  compose-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install pinned SDK components
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile five Compose review states and run JVM tests
        run: |
          gradle --no-daemon --stacktrace -p native-android :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Retain test reports only (no APK creation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine15-review-source-and-junit-${{ github.sha }}
          retention-days: 14
          path: |
            native-android/app/build/test-results/
            native-android/app/build/reports/tests/
          if-no-files-found: warn
