name: Engine 1.5 B7 self-hosted Android 35 device verification

on:
  push:
    branches:
      - infra/self-hosted-runner-smoke-20261104
    paths:
      - '.github/workflows/engine15-b7-device-self-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine15-b7-device-self-hosted
  cancel-in-progress: true

jobs:
  engine15-b7-device-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    steps:
      - name: Check out exact B7 head
        uses: actions/checkout@v4
        with:
          ref: 66fd5cf75226d8785fe599986f3c6f2d18be7668
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bind local Android SDK
        shell: powershell
        run: |
          $Sdk = "$env:LOCALAPPDATA\Android\Sdk"
          if (!(Test-Path "$Sdk\platform-tools\adb.exe")) { throw "adb.exe not found" }
          if (!(Test-Path "$Sdk\emulator\emulator.exe")) { throw "emulator.exe not found" }
          $Avds = & "$Sdk\emulator\emulator.exe" -list-avds
          if ($Avds -notcontains "Pixel_9") { throw "Pixel_9 AVD not found" }
          "ANDROID_HOME=$Sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$Sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$Sdk\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Android instrumentation tests
        shell: powershell
        run: |
          gradle --no-daemon --stacktrace -p native-android :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Start isolated API 35 emulator and run device tests
        shell: powershell
        run: |
          $Sdk = "$env:LOCALAPPDATA\Android\Sdk"
          $Adb = "$Sdk\platform-tools\adb.exe"
          $Emulator = "$Sdk\emulator\emulator.exe"

          & $Adb start-server | Out-Host
          $Existing = (& $Adb devices | Out-String)
          if ($Existing -match "emulator-5556\s+device") {
            & $Adb -s emulator-5556 emu kill
            Start-Sleep -Seconds 2
          }

          $StdOut = Join-Path $env:RUNNER_TEMP "stridelab-emulator.stdout.log"
          $StdErr = Join-Path $env:RUNNER_TEMP "stridelab-emulator.stderr.log"
          $Process = Start-Process -FilePath $Emulator -ArgumentList @(
            "-avd", "Pixel_9",
            "-port", "5556",
            "-no-window",
            "-no-audio",
            "-no-boot-anim",
            "-no-snapshot",
            "-gpu", "swiftshader_indirect",
            "-accel", "on"
          ) -RedirectStandardOutput $StdOut -RedirectStandardError $StdErr -PassThru
          "CI_EMULATOR_PID=$($Process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $Ready = $false
          for ($i = 0; $i -lt 150; $i++) {
            if ($Process.HasExited) {
              Write-Host "Emulator exited early with code $($Process.ExitCode)"
              if (Test-Path $StdOut) { Get-Content $StdOut | Out-Host }
              if (Test-Path $StdErr) { Get-Content $StdErr | Out-Host }
              throw "API 35 emulator process exited before boot completed"
            }

            $Devices = (& $Adb devices | Out-String)
            if ($Devices -match "emulator-5556\s+device") {
              $Boot = (& $Adb -s emulator-5556 shell getprop sys.boot_completed | Out-String).Trim()
              if ($Boot -eq "1") {
                $Ready = $true
                break
              }
            }
            Start-Sleep -Seconds 2
          }
          if (!$Ready) {
            if (Test-Path $StdOut) { Get-Content $StdOut | Out-Host }
            if (Test-Path $StdErr) { Get-Content $StdErr | Out-Host }
            throw "API 35 emulator did not finish booting within 5 minutes"
          }

          $Api = (& $Adb -s emulator-5556 shell getprop ro.build.version.sdk | Out-String).Trim()
          if ($Api -ne "35") { throw "Expected Android API 35, got API $Api" }

          & $Adb -s emulator-5556 shell settings put global window_animation_scale 0
          & $Adb -s emulator-5556 shell settings put global transition_animation_scale 0
          & $Adb -s emulator-5556 shell settings put global animator_duration_scale 0
          & $Adb -s emulator-5556 shell input keyevent 82
          $DeviceList = (& $Adb devices | Out-String)
          Write-Host $DeviceList
          $Connected = @($DeviceList -split "\r?\n" | Where-Object { $_ -match "\s+device\s*$" })
          if ($Connected.Count -ne 1 -or $Connected[0] -notmatch "^emulator-5556\s+") {
            throw "Expected emulator-5556 to be the only connected Android device"
          }

          gradle --no-daemon --stacktrace -p native-android :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=io.stridelab.privatealpha.Engine15FeedbackRepositoryTest,io.stridelab.privatealpha.Engine1RepositoryTest"
          if ($LASTEXITCODE -ne 0) {
            throw "Android 35 instrumentation tests failed with exit code $LASTEXITCODE"
          }

      - name: Retain device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine15-b7-self-hosted-device-evidence
          retention-days: 30
          path: |
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

      - name: Stop CI emulator
        if: always()
        shell: powershell
        run: |
          $Adb = "$env:LOCALAPPDATA\Android\Sdk\platform-tools\adb.exe"
          if (Test-Path $Adb) {
            $Existing = (& $Adb devices | Out-String)
            if ($Existing -match "emulator-5556\s+device") {
              & $Adb -s emulator-5556 emu kill
            }
          }
