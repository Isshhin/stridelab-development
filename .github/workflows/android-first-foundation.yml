name: Android first storage foundation verification
on:
  push:
    branches: ['feature/android-first-foundation-20261026']
    paths: ['android-app/**', '.github/workflows/android-first-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify accepted Android content and preserve exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh release download phase4d-final-candidate --repo "$GITHUB_REPOSITORY" --pattern 'StrideLab-Phase4D-Final-candidate.zip' --dir inputs
          python3 android-app/scripts/verify_phase4e.py inputs/StrideLab-Phase4D-Final-candidate.zip
          python3 android-app/scripts/checkpoint_android.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android and execute JVM tests
        working-directory: android-app/android
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug -PstrideVersionCode=2
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Enable ephemeral emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Verify SQLite durability, conflicts, rollback and existing WebView lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -accel on -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: cd android-app/android && gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest -PstrideVersionCode=2
      - name: Retain private source checkpoint and actual test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-foundation-source-and-evidence
          path: |
            android-app/checkpoints/
            android-app/android/app/build/reports/tests/
            android-app/android/app/build/reports/androidTests/
            android-app/android/app/build/outputs/androidTest-results/
          retention-days: 30
          if-no-files-found: warn
