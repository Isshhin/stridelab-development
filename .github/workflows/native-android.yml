name: Native Android migration verification
on:
  push:
    branches: ['feature/native-compose-migration-20261026', 'feature/native-real-data-phase2-20261026']
    paths: ['native-android/**', 'android-app/android/app/src/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build native APK and run unit tests
        working-directory: native-android
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Build preserved legacy APK and isolated upgrade seed test
        run: gradle --no-daemon -p android-app/android -I "$GITHUB_WORKSPACE/native-android/legacy-upgrade.init.gradle" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Reserve emulator disk space
        run: |
          df -h .
          # This disposable job needs Android, not the preinstalled .NET/CodeQL SDKs.
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h .
          android_available_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$android_available_kb" -gt 9000000
      - name: Enable emulator acceleration
        run: |
          if [ ! -e /dev/kvm ]; then
            sudo modprobe kvm
            sudo mknod /dev/kvm c 10 232
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Test native navigation, saved state, SQLite and Keystore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -accel on -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r android-app/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-app/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class io.stridelab.privatealpha.LegacyUpgradeSeedTest io.stridelab.privatealpha.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/legacy-upgrade-seed.txt
            grep -F 'OK (1 test)' /tmp/legacy-upgrade-seed.txt
            cd native-android && gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectLegacyUpgrade=true
            mkdir -p native-android/app/build/reports/native-ui-evidence
            adb pull /sdcard/Android/data/io.stridelab.privatealpha/files/native-ui-evidence/. native-android/app/build/reports/native-ui-evidence/
            test -f native-android/app/build/reports/native-ui-evidence/home.png
      - name: Archive source checkpoint
        if: always()
        run: python3 native-android/checkpoint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-migration-source-and-evidence
          retention-days: 30
          path: |
            native-android/checkpoints/*
            native-android/app/build/reports/
            native-android/app/build/outputs/androidTest-results/
            native-android/app/build/test-results/
          if-no-files-found: warn
