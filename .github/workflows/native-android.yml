name: Native Android migration verification
on:
  push:
    branches: ['feature/native-compose-migration-20261026', 'feature/native-real-data-phase2-20261026', 'feature/native-reconstruction-1-20261026', 'feature/native-guided-multisession-integration-20261027']
    paths: ['native-android/**', 'android-app/android/app/src/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
    inputs:
      durable_signed_build:
        description: Build with configured durable private developer signing secrets after all gates pass
        type: boolean
        default: false
      signed_version_code:
        description: Signed versionCode, higher than installed build (minimum 15)
        default: '15'
        required: true
permissions:
  contents: read
jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify read-only APK compatibility gate
        run: python3 -m unittest discover -s native-android/tools/tests -v
      - name: Build native APK and run unit tests
        working-directory: native-android
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Build preserved legacy APK and isolated upgrade seed test
        run: gradle --no-daemon -p android-app/android -I "$GITHUB_WORKSPACE/native-android/legacy-upgrade.init.gradle" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Compare actual built legacy and native APK metadata
        run: |
          mkdir -p native-android/app/build/reports
          python3 native-android/tools/check_apk_update.py --installed-apk android-app/android/app/build/outputs/apk/debug/app-debug.apk --candidate native-android/app/build/outputs/apk/debug/app-debug.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" > native-android/app/build/reports/apk-update-metadata.json
          cat native-android/app/build/reports/apk-update-metadata.json
      - name: Compile isolated lifecycle probe test APK
        working-directory: native-android
        run: gradle --no-daemon :app:assembleDebugAndroidTest -PstrideProcessProbe=true
      - name: Reserve emulator disk space
        run: |
          df -h .
          # This disposable job needs Android, not the preinstalled .NET/CodeQL SDKs.
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h .
          android_available_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$android_available_kb" -gt 9000000
      - name: Enable emulator acceleration
        run: |
          if [ ! -e /dev/kvm ]; then
            sudo modprobe kvm
            sudo mknod /dev/kvm c 10 232
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Test native navigation, saved state, SQLite and Keystore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -accel on -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: python3 native-android/tools/validate_emulator.py
      - name: Package private native APK with integrity and signing metadata
        if: success() && github.event.repository.private == true
        run: |
          python3 native-android/tools/package_private_apk.py --apk native-android/app/build/outputs/apk/debug/app-debug.apk --output native-android/app/build/private-apk --commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cp native-android/app/build/reports/apk-update-metadata.json native-android/app/build/private-apk/ci-emulator-update-metadata.json
          cp native-android/tools/check_apk_update.py native-android/app/build/private-apk/
      - name: Upload private installable native APK
        if: success() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: stridelab-native-private-apk-${{ github.sha }}
          retention-days: 30
          path: native-android/app/build/private-apk/
          if-no-files-found: error
      - name: Archive source checkpoint
        if: always()
        run: python3 native-android/checkpoint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-migration-source-and-evidence
          retention-days: 30
          path: |
            native-android/checkpoints/*
            native-android/app/build/reports/
            native-android/app/build/outputs/androidTest-results/
            native-android/app/build/test-results/
          if-no-files-found: warn
  durable-private-signing:
    needs: native-android
    if: github.event_name == 'workflow_dispatch' && inputs.durable_signed_build && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and verify pinned durable signer without exposing secrets
        env:
          STRIDELAB_KEYSTORE_BASE64: ${{ secrets.STRIDELAB_KEYSTORE_BASE64 }}
          STRIDELAB_STORE_PASSWORD: ${{ secrets.STRIDELAB_STORE_PASSWORD }}
          STRIDELAB_KEY_ALIAS: ${{ secrets.STRIDELAB_KEY_ALIAS }}
          STRIDELAB_KEY_PASSWORD: ${{ secrets.STRIDELAB_KEY_PASSWORD }}
          STRIDELAB_EXPECTED_SIGNER_SHA256: ${{ vars.STRIDELAB_EXPECTED_SIGNER_SHA256 }}
          SIGNED_VERSION_CODE: ${{ inputs.signed_version_code }}
        run: python3 native-android/tools/build_durable_private.py --version "$SIGNED_VERSION_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: stridelab-native-durable-private-${{ github.sha }}
          retention-days: 30
          path: native-android/app/build/durable-private-apk/
          if-no-files-found: error
