name: Native Android migration verification
on:
  push:
    branches: ['feature/native-compose-migration-20261026']
    paths: ['native-android/**', 'android-app/android/app/src/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build native APK and run unit tests
        working-directory: native-android
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Test native navigation, saved state, SQLite and Keystore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -accel on -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: cd native-android && gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Archive source checkpoint
        if: always()
        run: python3 native-android/checkpoint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-migration-source-and-evidence
          retention-days: 30
          path: |
            native-android/checkpoints/*
            native-android/app/build/reports/
            native-android/app/build/outputs/androidTest-results/
            native-android/app/build/test-results/
          if-no-files-found: warn
