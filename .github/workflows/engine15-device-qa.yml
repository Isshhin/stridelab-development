name: Engine 1.5 isolated device verification

on:
  push:
    branches:
      - feature/engine15-versioned-foundation-20261103
    paths:
      - 'native-android/**'
      - '.github/workflows/engine15-device-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine15-device-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-engine15-device-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install pinned SDK components
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify protected sources and library schema
        run: |
          python3 -m pip install jsonschema==4.26.0
          python3 native-android/tools/validate_exercise_library.py
          python3 -m unittest discover -s native-android/tools/tests -v
      - name: Compile Engine 1.5 and Android instrumentation tests
        run: gradle --no-daemon --stacktrace -p native-android :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Reserve emulator disk and enable acceleration
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h .
          if [ ! -e /dev/kvm ]; then
            sudo modprobe kvm
            sudo mknod /dev/kvm c 10 232
          fi
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Validate actual SQLite, revision safety and offline reopen on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -accel on -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            gradle --no-daemon --stacktrace -p native-android :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=io.stridelab.privatealpha.Engine15FeedbackRepositoryTest,io.stridelab.privatealpha.Engine1RepositoryTest'
      - name: Retain offline unit and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine15-offline-device-evidence-${{ github.sha }}
          retention-days: 30
          path: |
            native-android/app/build/test-results/
            native-android/app/build/reports/tests/
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
