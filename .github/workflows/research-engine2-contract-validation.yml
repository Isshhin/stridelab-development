name: Research Engine 2.0 contract and adversarial validation

on:
  push:
    branches:
      - research/runna-garmin-coaching-20261102
      - research/batch8l-evidence-review-20261103
    paths:
      - 'research/validation/**'
      - 'docs/research/**'
      - 'docs/research/experiments/experiment-003-load-policy-counterfactuals.csv'
      - 'docs/research/experiments/experiment-004-multidiscipline-coordination.csv'
      - 'docs/research/experiments/experiment-005-adaptation-state-and-load-metrics.csv'
      - '.github/workflows/research-engine2-contract-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/validation/**'
      - 'docs/research/experiments/experiment-003-load-policy-counterfactuals.csv'
      - 'docs/research/experiments/experiment-004-multidiscipline-coordination.csv'
      - 'docs/research/experiments/experiment-005-adaptation-state-and-load-metrics.csv'
      - '.github/workflows/research-engine2-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contracts:
    name: Research-only policies, SQLite recovery and adversarial checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Negative-control unit tests and registry drift audit
        run: python -m unittest discover -s research/validation -p 'test_*.py' -v
      - name: Test research registry and synthetic contract model
        run: python research/validation/runner.py --output research-validation.json
      - name: Execute B0/H1 frozen policy comparisons
        run: python research/validation/policy_runner.py --output research-policy-comparison.json
      - name: Execute seeded adversarial cohorts (unseen by 8B frozen comparisons)
        run: python research/validation/heldout_runner.py --seed 82603 --per-cohort 12 --output research-heldout-results.json
      - name: Record all B0-H1 disagreements for independent review
        run: python research/validation/difference_review.py --output research-decision-differences.json
      - name: Execute eight-week synthetic plan and activity lifecycle
        run: python research/validation/multiweek_runner.py --output research-multiweek-results.json
      - name: Report original-lab adapter access and research prototype scope
        run: python research/validation/adapter_probe.py
      - name: Audit availability of the original independent lab source
        run: python research/validation/original_lab_admission.py --output research-original-lab-admission.json
      - name: Check manually transferred original-lab synthetic policy evidence
        run: python research/validation/original_lab_evidence_8l.py --handoff research/validation/evidence/original_lab_8l.json --review-pin research/validation/evidence/original_lab_8l_review_pin.json --output research-original-policy-evidence-8l.json
      - name: Audit real-world field outcome eligibility
        run: python research/validation/field_outcome_gate.py --output research-field-outcome-readiness.json
      - name: Publish scope-aware summary
        if: always()
        shell: bash
        run: |
          {
            echo '## StrideLab research-only validation'
            echo
            echo '**This is not a test of the real coaching engine.**'
            echo 'Checks run against an isolated synthetic reference model.'
            echo
            if [ -f research-validation.json ]; then
              python - <<'PY'
          import json
          with open('research-validation.json', encoding='utf-8') as f:
              j = json.load(f)
          print('### Synthetic contract checks')
          for k, v in j['contract_by_experiment'].items():
              print(f"- {k}: {v['PASS']} PASS, {v['FAIL']} FAIL")
          print()
          print('### Engine integration')
          print(f"- Actual Engine 2.0: {j['engine_results']['BLOCKED']} BLOCKED, 0 executed")
          print('- Runna Experiment 002: 0 of 16 authenticated cases run')
          print('- Garmin Run Coach: no paired controlled observations')
          PY
            else
              echo '**Validation runner did not produce a report. Check logs.**'
            fi
            if [ -f research-policy-comparison.json ]; then
              python - <<'PY'
          import json
          with open('research-policy-comparison.json', encoding='utf-8') as f:
              p = json.load(f)
          counts = p['counts']
          print()
          print('### New B0/H1 research policy implementations (NOT production or old local lab)')
          print(f"- Frozen scenarios: {counts['PASS']} structural PASS, {counts['FAIL']} FAIL, {counts['BLOCKED_UNCALIBRATED_PREDICTION']} BLOCKED")
          print(f"- Action disagreement scenarios: {p['cases_with_B0_H1_action_difference']}")
          print('- Predictive models are uncalibrated; no athlete effectiveness or clinical safety conclusions.')
          PY
            else
              echo '**B0/H1 policy report missing. Check logs.**'
            fi
            if [ -f research-heldout-results.json ]; then
              python - <<'PY'
          import json
          with open('research-heldout-results.json', encoding='utf-8') as f:
              h = json.load(f)
          print()
          print('### Newly generated seeded adversarial scenarios (research only)')
          print(f"- {h['counts']['PASS']} PASS, {h['counts']['FAIL']} FAIL, {h['counts']['TOTAL']} total; seed {h['seed']}")
          print('- These are structural synthetic checks, NOT longitudinal coaching effectiveness.')
          PY
            else
              echo '**Held-out scenario report missing. Check logs.**'
            fi
            if [ -f research-decision-differences.json ]; then
              python - <<'PY'
          import json
          with open('research-decision-differences.json', encoding='utf-8') as f:
              r = json.load(f)
          print()
          print('### B0/H1 difference audit (research only)')
          print(f"- {r['scenarios_with_difference']} scenarios with different proposed actions")
          print('- All review entries remain unvalidated for coaching benefit.')
          PY
            fi
            if [ -f research-multiweek-results.json ]; then
              python - <<'PY'
          import json
          with open('research-multiweek-results.json', encoding='utf-8') as f:
              m = json.load(f)
          print()
          print('### Eight-week training-history reconciliation (research only)')
          print(f"- {m['counts']['PASS']} profile PASS, {m['counts']['FAIL']} FAIL, {m['total_week_scenarios']} simulated athlete-weeks")
          for item in m['results']:
              print(f"- {item['profile']}: {item['status']}; {len(item['weeks'])} weeks, {item['source_records']} source records, {item['summary']['h1_diff_weeks']} B0/H1 differing weeks")
          print('- No athlete effectiveness, local lab, or Android engine tested.')
          PY
            else
              echo '**Multiweek report missing. Inspect failing step logs.**'
            fi
            if [ -f research-adapter-status.json ]; then
              python - <<'PY'
          import json
          with open('research-adapter-status.json', encoding='utf-8') as f:
              r = json.load(f)
          print()
          print('### Batch 8E adapter provenance')
          for a in r['adapters']:
              print(f"- {a['adapter_id']}: {a['status']}")
          print('- Provider credentials and source authorization not connected.')
          PY
            fi
            if [ -f research-original-policy-evidence-8l.json ]; then
              python - <<'PY'
          import json
          with open('research-original-policy-evidence-8l.json', encoding='utf-8') as f:
              r = json.load(f)
          print()
          print('### Batch 8L manual original-lab policy output handoff (NOT source execution)')
          print(f"- Synthetic original policy decisions reviewed: {r['original_policy_comparison_rows_checked']}")
          print(f"- Original validator failures retained: {r['original_validation_error_plans_preserved']}")
          print(f"- Explicitly infeasible schedules retained: {r['original_infeasible_plans_preserved']}")
          print('- Cross-private-repo source checkout: NOT performed; origin independently authenticated: NO.')
          print('- Real athletes/coaching outcomes: NONE. Original full-source admission remains separate and blocked.')
          PY
            fi
            if [ -f research-original-lab-admission.json ]; then
              python - <<'PY'
          import json
          with open('research-original-lab-admission.json', encoding='utf-8') as f:
              r = json.load(f)
          print()
          print('### Batch 8F original independent lab source admission')
          print(f"- Status: {r['original_lab_status']}")
          print(f"- Source executed: {r['execution']}; original provenance independently verified: {r['origin_verified']}")
          PY
            fi
            if [ -f research-field-outcome-readiness.json ]; then
              python - <<'PY'
          import json
          with open('research-field-outcome-readiness.json', encoding='utf-8') as f:
              r = json.load(f)
          print()
          print('### Batch 8F real athlete outcome evidence readiness')
          print(f"- Status: {r['status']}; athlete outcomes analyzed: {r['athlete_outcomes_analyzed']}")
          print(f"- Real effect demonstrated: {r['actual_performance_effect_demonstrated']}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-validation-results
          path: |
            research-validation.json
            research-policy-comparison.json
            research-heldout-results.json
            research-decision-differences.json
            research-multiweek-results.json
            research-adapter-status.json
            research-original-lab-admission.json
            research-original-policy-evidence-8l.json
            research-field-outcome-readiness.json
          if-no-files-found: warn
          retention-days: 30
