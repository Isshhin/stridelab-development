name: Trackside Batch B responsive device QA

on:
  push:
    branches:
      - feature/trackside3-compose-foundation-20261102
      - design/trackside3-figma-parity-no-build-20261103
    paths:
      - 'native-android/**'
      - '.github/workflows/trackside-responsive-qa.yml'
  pull_request:
    branches:
      - integration/native-pre-trackside3-verified-20261030
    paths:
      - 'native-android/**'
      - '.github/workflows/trackside-responsive-qa.yml'

permissions:
  contents: read

concurrency:
  group: trackside-batch-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-device-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native 1.0 font scale frames are the actual Figma visual baseline.
          - profile: figma-360dp-font100
            pixels: 720x1600
            dpi: 320
            font: '1.0'
          - profile: figma-412dp-font100
            pixels: 824x1900
            dpi: 320
            font: '1.0'
          # Preserve larger-font accessibility/regression coverage separately.
          - profile: compact-360dp-font130
            pixels: 720x1600
            dpi: 320
            font: '1.3'
          - profile: standard-412dp-font150
            pixels: 824x1900
            dpi: 320
            font: '1.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run responsive Compose tests and capture synthetic screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.pixels }}
            adb shell wm density ${{ matrix.dpi }}
            adb shell settings put system font_scale ${{ matrix.font }}
            bash native-android/tools/collect-responsive-qa.sh ${{ matrix.profile }}
      - name: Upload screenshot and instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackside-batch-b-${{ matrix.profile }}
          path: |
            native-android/app/build/qa-screenshots/${{ matrix.profile }}/
            native-android/app/build/reports/androidTests/connected/
            native-android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
