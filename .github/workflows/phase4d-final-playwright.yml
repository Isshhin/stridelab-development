name: Phase 4D Final official Playwright and axe verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-phase4d-final-candidate:
    name: Verify Phase 4D Final candidate (checkpoint gate)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out private development repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Phase 4D Final candidate from private prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archive
          gh release download phase4d-final-candidate --repo "${GITHUB_REPOSITORY}" --pattern 'StrideLab-Phase4D-Final-candidate.zip' --dir archive

      - name: Verify archive and extract exact candidate
        shell: bash
        run: |
          echo "915c9c37e3816291bfc9ab3ead1f37b400711886056a43fd1af101b602cdaa6b  archive/StrideLab-Phase4D-Final-candidate.zip" | sha256sum -c -
          unzip -tq archive/StrideLab-Phase4D-Final-candidate.zip
          mkdir -p _ws5
          unzip -q archive/StrideLab-Phase4D-Final-candidate.zip -d _ws5

      - name: Verify 630 checkpoint manifest payload hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path('_ws5/StrideLab-WS5')
          manifest=json.loads((root/'SHA256-MANIFEST-Phase4D-Final-candidate.json').read_text())
          bad=[]
          for rel, expected in manifest.items():
              f=root/rel
              if not f.is_file() or hashlib.sha256(f.read_bytes()).hexdigest()!=expected:
                  bad.append(rel)
          print(f'Phase 4D Final manifest: {len(manifest)-len(bad)}/{len(manifest)} verified')
          if bad or len(manifest)!=630:
              print('Unexpected manifest count or mismatches:',bad[:20])
              sys.exit(1)
          PY

      - name: Rebuild HTML and check protected engine and 4D.1 baseline
        shell: bash
        run: |
          cd _ws5/StrideLab-WS5
          python3 tools/build_p4d2.py
          echo "d43ae2539d2c4d0da2e289ab6fec270366d7351e5d973d6495cc57d7627e4466  stridelab-afterglow-phase4d2-wip.html" | sha256sum -c -
          echo "cffaad8e9856d988f864cb09143a63aeac573b453aa0978abcded3dfb054bd9d  baseline-4d1/stridelab-afterglow-phase4d1-final.html" | sha256sum -c -
          python3 tools/verify_ws3_integrity.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install official Playwright and axe dependencies
        working-directory: _ws5/StrideLab-WS5/suite
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium and Linux dependencies
        working-directory: _ws5/StrideLab-WS5/suite
        run: npx playwright install --with-deps chromium

      - name: Run full official Playwright suite including axe
        working-directory: _ws5/StrideLab-WS5/suite
        env:
          PROTO: ${{ github.workspace }}/_ws5/StrideLab-WS5/stridelab-afterglow-phase4d2-wip.html
          CI: "true"
        run: npx playwright test

      - name: Check full 273-test Phase 4D Final candidate regression
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('fs');
          const p='_ws5/StrideLab-WS5/suite/results/results.json';
          if(!fs.existsSync(p)){console.error('Official Playwright JSON report missing');process.exit(1);}
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          const s=d.stats||{};
          console.log('Official Phase 4D Final candidate Playwright result:',JSON.stringify(s));
          if(s.expected!==273 || s.unexpected!==0 || s.flaky!==0 || s.skipped!==0){
            console.error('Expected exactly 273 passes, zero failures/skips/flaky; do not accept Phase 4D Final.');
            process.exit(1);
          }
          JS

      - name: Upload test evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4d-final-candidate-official-playwright-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            _ws5/StrideLab-WS5/suite/results/results.json
            _ws5/StrideLab-WS5/suite/results/artifacts/
            _ws5/StrideLab-WS5/evidence/phase4d-final-candidate/
