button:disabled,button[aria-disabled="true"]{opacity:.38;cursor:not-allowed;filter:saturate(.4)}

nav .on{background:transparent;color:var(--sig);box-shadow:none}
@container (max-width:19rem){nav .on{background:var(--sig-soft);box-shadow:inset 0 0 0 1.5px var(--sig-line);color:var(--sig)}}

 nav button:not(.on):hover{color:var(--tx)}

/* 2. Workout presentation: discipline glyph, session timeline, exercise rows, week status strip. */
.gly{width:14px;height:14px;flex:none}

.og{display:flex;flex-direction:column}

.og h2.wide{display:none}

.wkdots li.tdy{color:var(--tx)}
.pip{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--c,var(--s3)) 65%,transparent);color:var(--c);font-style:normal}

.sample{font-size:.6875rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px dashed var(--mu);color:var(--mu);white-space:nowrap}
.card.demo{border-style:dashed;border-color:rgba(255,255,255,.2)}
.coach p+p{margin-top:8px}
.fit{display:inline-block;font-size:.6875rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);margin-right:8px;vertical-align:1px}
.fit.exact,.fit.progression{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.fit.related,.fit.schematic{color:var(--mu);border:1px dashed var(--mu)}
.tile .tag .gly{width:12px;height:12px}
.lib-photo img{background:#fff}
.hero.w .tlnote,.hero.w .xl{pointer-events:none}

/* 3. Responsive compositions. Mobile stays one column; tablet adds a second column; desktop adds a navigation rail. */
.trg{display:block}

}

/* ---- Phase 4D.2 WS1: scroll lock ---- */

#wz .step-lad .tile i{font-style:normal;font-size:.75rem;font-weight:800;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}

#wz .prov.t{background:color-mix(in srgb,var(--ok) 20%,#000);color:var(--ok)}
#wz .kmnote{font-size:.875rem;line-height:1.45;color:var(--mu);margin-top:10px}

#wz .tgl .chip{width:100%;min-height:52px;white-space:normal;text-align:center;line-height:1.15;border-radius:16px;background:var(--s1);border:1px solid var(--ln)}
#wz .tgl .chip[aria-pressed="true"]{background:var(--sig);color:var(--sig-ink);border-color:transparent}
#wz .tgl .chip[aria-pressed="true"]:before{content:none}
@media(prefers-reduced-motion:reduce){#wz *{scroll-behavior:auto!important}}

/* ---- Phase 4D.2 WS3: calendar picker + weekly preview ---- */
#wz .calw{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:10px 6px 8px}
#wz .calh{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px 8px}

#wz .calsum{margin-top:10px;font-size:.9375rem;line-height:1.45;overflow-wrap:anywhere}
#wz .wkn{display:flex;align-items:center;gap:8px;margin-top:8px}
#wz .wkt{flex:1;min-width:0;text-align:center;line-height:1.3;overflow-wrap:anywhere}
#wz .wkt:focus{outline:none}
#wz .wkst{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#wz .pdg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:10px}
#wz .pd{min-width:0;min-height:84px;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;background:var(--s1);border:1px solid var(--ln);overflow:hidden;color:var(--tx)}
#wz .pd.on{border-color:var(--sig);box-shadow:inset 0 0 0 1px var(--sig);background:var(--s3)}
#wz .pd.tdy .pdn{text-decoration:underline;text-underline-offset:3px}
#wz .pdw{font-size:.75rem;font-weight:700;color:var(--mu)}

#wz .pb.run{background:var(--run)}#wz .pb.str{background:var(--str)}#wz .pb.cal{background:var(--cal)}

#wz .pb.w{background:transparent;border:1px solid var(--str);color:var(--str);line-height:18px}

#wz .dcard h3{margin:0 0 4px;font-size:1.125rem}#wz .dcard h3:focus{outline:none}

/* Scope exercise rows away from the activity sheet's unrelated .xr flex rows.
   Query actual card width in em units so enlarged text gets room to reflow. */
.hero{container-type:inline-size}
.hero .xr{display:grid;grid-template-columns:1.5rem minmax(0,1fr) auto}
.hero .tl{flex-wrap:wrap}
@container (max-width:17rem){
 .hero .xr{grid-template-columns:1.5rem minmax(0,1fr)}
 .hero .xr .m{grid-column:2;text-align:left;white-space:normal}
 .hero .tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
 .hero .tl .seg{min-width:0;overflow-wrap:anywhere}
}

/* ---- Phase 4D.2 WS4: consistent selection controls (reference: .sgm) ---- */
.chips.sgm{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:4px;padding:4px;border-radius:20px;background:var(--s1);border:1px solid var(--ln);overflow:visible}
.chips.sgm .chip{width:100%;min-width:0;max-width:none;min-height:48px;padding:6px 4px;white-space:normal;text-align:center;line-height:1.15;border-radius:16px;background:transparent;border:1px solid transparent;font-size:.9375rem;}
.chips.sgm .chip.on,.chips.sgm .chip[aria-pressed="true"]{background:var(--sig);color:var(--sig-ink);border-color:transparent;font-weight:800}
.chips.sgm .chip:not(.on):not(:disabled):hover{background:var(--s2)}
.chips.sgm .chip:focus-visible{position:relative;z-index:1}
.chips.sgm.n4,.chips.sgm.n5{--n:4}

.chips.sgm .chip{overflow-wrap:anywhere}
.wsfl{margin:14px 0 6px;font-size:.875rem;color:var(--mu);font-weight:600}
.dayw .chips.days7 .chip[aria-pressed="false"]{background:var(--s2)}
/* WS4-D: 44px interactive map action; non-interactive label chips stay 36px */
.ad .ml button[data-a="adwr"]{min-height:44px!important;min-width:44px}
.ad .zm .gly{font-size:min(1.375rem,26px);line-height:1}

#wz .cd{font-size:min(1rem,5cqw)}
#wz .calnav{font-size:min(1.375rem,7cqw)}

.rs-mini{display:block;position:relative;height:12px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,var(--s1))}

.glance{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:12px 0}
.glance>div{min-width:0;overflow-wrap:anywhere}
.list>button{max-width:100%;min-width:0}
.list>button>span{min-width:0;max-width:100%;overflow-wrap:anywhere}
.pill{max-width:100%;white-space:normal;overflow-wrap:anywhere}

<script id="eng">
/* StrideLab prototype planning model: deterministic, no network, no UI. Prototype rules only, needs coach review. */
const Engine=(()=>{
const D2=n=>String(n).padStart(2,'0'),I=d=>d.getFullYear()+'-'+D2(d.getMonth()+1)+'-'+D2(d.getDate()),F=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},A=(s,n)=>{const d=F(s);d.setDate(d.getDate()+n);return I(d)},WD=s=>F(s).getDay(),R=(x,s=.5)=>Math.round(x/s)*s,gap=(a,b)=>Math.round((F(a)-F(b))/864e5);
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PACE=[7,6.3,5.7,5]; // easy pace min/km by experience: an assumption, disclosed in the plan
const RG={begin:{n:'Aerobic foundation',cap:10,pk:1.5,ev:0,d:'Build easy running habit'},k5:{n:'Improve 5K',cap:14,pk:1.3,ev:1,d:'Faster over 5 km'},k10:{n:'Improve 10K',cap:18,pk:1.35,ev:1,d:'Stronger threshold'},hm:{n:'Half marathon',cap:24,pk:1.5,ev:1,d:'21.1 km with a taper'},mar:{n:'Marathon',cap:32,pk:1.6,ev:1,d:'42.2 km with a taper'},gen:{n:'General running fitness',cap:16,pk:1.25,ev:0,d:'Steady, flexible fitness'}};

const LAD={pull:['Dead hang','Scapular pull','Negative pull-up','Banded pull-up','Pull-up','Archer pull-up'],push:['Incline push-up','Push-up','Diamond push-up','Archer push-up','Pseudo planche push-up'],hand:['Wall plank','Chest-to-wall hold','Wall shoulder taps','Kick-up practice','Freestanding attempts'],core:['Dead bug','Hollow hold','Hanging knee raise','Hanging leg raise','Tuck L-sit']};
const CG={gen:{n:'Calisthenics foundation',lad:['push','pull','core'],d:'Push, pull and core'},pull:{n:'Pull-up progression',lad:['pull'],d:'Hang to first pull-up'},push:{n:'Push-up progression',lad:['push'],d:'Incline to archer'},hand:{n:'Handstand foundations',lad:['hand'],d:'Wall work to balance'},core:{n:'Core strength and control',lad:['core'],d:'Hollow to L-sit'}};
const HOLD=['Dead hang','Chest-to-wall hold','Wall plank','Hollow hold','Tuck L-sit','Plank'];
const SV={squat:[['bb','Back squat'],['db','Goblet squat'],['bw','Bodyweight squat']],hinge:[['bb','Romanian deadlift'],['db','DB Romanian deadlift'],['bw','Single-leg hip hinge']],push:[['bb','Bench press'],['db','DB bench press'],['bw','Push-up']],pull:[['bb','Barbell row'],['db','One-arm DB row'],['bands','Band row'],['bw','Inverted row']],lunge:[['db','DB split squat'],['bands','Banded split squat'],['bw','Reverse lunge']],core:[['bw','Plank']]};

const pick=(pt,eq)=>SV[pt].find(x=>eq.includes(x[0]))||SV[pt][SV[pt].length-1];
const norm=p=>Object.assign({mins:60,weeks:12,days:[1,2,4,6],longDay:6,qDays:[2,4],goals:{},interrupted:false,mods:[]},p,{run:Object.assign({exp:1,weekKm:20,longKm:8,freq:3,q:1},p.run),str:Object.assign({exp:1,freq:2,eq:['bw']},p.str),cal:Object.assign({exp:0,stage:0,freq:2,mode:'auto'},p.cal)});

function runWeeks(p){const r=p.run,g=RG[p.goals.run],W=p.weeks,base=Math.max(r.weekKm,6),pct=base<25?.1:base<50?.07:.05,pk=base*(1+(g.pk-1)*(base<30?1:base<60?.5:.25)),start=Math.max(5,R(base*(p.interrupted?.6:.95)));
let prev=start,Lp=p.interrupted?Math.max(3,R(r.longKm*.7)):Math.max(3,r.longKm);const out=[];
for(let w=0;w<W;w++){const rec=w%4===3&&w<W-1,tap=!!g.ev&&W>=8&&w>=W-2;let km;
 if(w===0)km=start;else if(rec)km=R(prev*.8);else if(tap)km=R(prev*(w===W-1?.55:.75));else{km=Math.min(R(prev*(1+pct)),Math.max(prev,R(pk)));km=Math.max(km,Math.min(prev+.5,R(pk)))}

function qual(p,w,qi,rec,pace){const g=p.goals.run,W=p.weeks,pr=w/Math.max(1,W-1),Ls={begin:['Fartlek'],gen:['Fartlek','Tempo'],k5:['Intervals','Hills','Threshold'],k10:['Threshold','Intervals','Tempo'],hm:['Tempo','Threshold','Intervals'],mar:['Tempo','Threshold']}[g],t=Ls[(w+qi)%Ls.length],f=rec?.7:1;let main,wk,rc;
 if(t==='Intervals'){const n=Math.max(3,Math.floor((4+pr*4)*f));main=`${n} × 3 min fast, 2 min jog`;wk=n*3;rc=(n-1)*2}
 else if(t==='Threshold'){const n=Math.max(2,Math.floor((3+pr*2.9)*f)),m=6+Math.floor(pr*3);main=`${n} × ${m} min at threshold, 2 min jog`;wk=n*m;rc=(n-1)*2}

 else{const n=Math.max(4,Math.floor((6+pr*4)*f));main=`${n} × 1 min fast, 1 min easy`;wk=n;rc=n}

function buildRun(p,rw,w,sl){const r=p.run,pace=PACE[r.exp],x=rw.out[w],items=[],n=Math.min(r.freq,p.days.length);
 const q=r.exp<1?0:Math.min(r.q,n>=4?2:n>=2?1:0);
 if(n>=2)items.push({cls:'long',key:'L',disc:'run',title:'Long run',km:x.L,mins:Math.round(x.L*pace),steps:[['Warm-up','10 min easy'],['Main',`${R(Math.max(1,x.L-1.5),.5)} km conversational`],['Cooldown','5 min walk-jog']]});

 for(let i=0;i<ne;i++){const a=Math.min(8,2+Math.floor(w/2));items.push({cls:'easy',key:'E'+i,disc:'run',title:r.exp===0?'Run/walk':'Easy run',km:ek,mins:Math.round(ek*pace),steps:[['Warm-up','5 min brisk walk'],['Main',r.exp===0?`${a} min run, 1 min walk, repeat to ${ek} km`:`${ek} km easy, conversational`],['Cooldown','5 min walk']]})}

const dur=(ex,warm)=>Math.ceil(warm+ex.reduce((a,e)=>a+e.sets*((e.hold?e.reps:e.reps*3)+e.rest)/60+1,0));
const TT={1:['FA'],2:['FA','FB'],3:['LO','UP','FA'],4:['LO','UP','LO2','UP']},DD={FA:['squat','push','pull','hinge','core'],FB:['hinge','push','pull','lunge','core'],LO:['squat','hinge','lunge','core'],LO2:['hinge','squat','lunge','core'],UP:['push','pull','core']},TN={FA:'Full body A',FB:'Full body B',LO:'Lower body',LO2:'Lower body B',UP:'Upper body'};
function buildStr(p,w,rec,heavy){const s=p.str,g=SG[p.goals.str],eq=s.eq.concat('bw'),T=TT[Math.min(4,s.freq)],items=[];
 T.forEach((code,i)=>{const sets=[2,3,3,4][s.exp]-(rec?1:0),[lo,hi]=g.rep,reps=s.exp===0?hi:Math.min(hi,lo+(w%4)*Math.max(1,Math.round((hi-lo)/3)));
  let ex=DD[code].map((pt,j)=>{const v=pick(pt,eq),low=['squat','hinge','lunge'].includes(pt),core=pt==='core',cmp=j<2;let st=core?2:sets;if(low&&heavy)st=Math.max(2,st-1);
   return{n:v[1],eq:EQL[v[0]],pat:pt,low,sets:st,hold:core,reps:core?30+(w%4)*5:reps,rest:core?45:cmp?(s.exp>0?120:90):75,cue:core?'Hold with a neutral spine.':`Choose a load leaving ${s.exp<2?3:2}–${s.exp<2?4:3} reps in reserve. Add load once every set reaches ${reps} reps.`}});

function buildCal(p,w,rec,maxM){const c=p.cal,g=CG[p.goals.cal],items=[],seq={1:['S'],2:['S','C'],3:['S','T','C'],4:['S','T','C','T']}[Math.min(4,c.freq)];
 const st=lad=>Math.min(LAD[lad].length-1,Math.min(c.stage,LAD[lad].length-1)+(rec||(p.mods||[]).some(m=>w>=m.from&&w<=m.to)?Math.floor((w-1)/4):Math.floor(w/4)));

function sched(p,ws,items){const slots=[];for(let i=0;i<7;i++){const d=A(ws,i);if(p.days.includes(WD(d)))slots.push(d)}
 const used={},out=[],iss=[],near=(a,b)=>Math.abs(gap(a,b))<=1,fr=()=>slots.filter(d=>!used[d]),put=(it,d)=>{used[d]=1;it.date=d;out.push(it)},of=c=>out.filter(o=>o.cls===c).map(o=>o.date);

   else if(cls==='str'){if(it.lower){if(L.some(x=>gap(x,d)===1))s+=100;if(L.some(x=>gap(d,x)===1))s+=25;if(Q.some(x=>near(x,d)))s+=40}else if(Q.some(x=>near(x,d)))s+=5;if(S.some(x=>near(x,d)))s+=20}
   else if(cls==='cal'){if(Q.some(x=>near(x,d)))s+=10;if(S.some(x=>near(x,d)))s+=15;if(C.some(x=>near(x,d)))s+=25;if(L.some(x=>gap(x,d)===1))s+=10}
   else{if(out.some(o=>o.cls==='easy'&&near(o.date,d)))s+=3}
   s+=gap(d,ws)*.01;if(s<bs){bs=s;best=d}});

  if(!p.days.includes(WD(s.date)))W.push({sid:s.id,msg:'Not one of your available days'});
  if(n>1)W.push({sid:s.id,msg:'Another session is already on this day'});
  if(s.lower&&has(A(s.date,1),x=>x.cls==='long'))W.push({sid:s.id,msg:'Legs the day before your long run'});
  if(s.lower&&(has(s.date,x=>x.hard&&x!==s)||has(A(s.date,-1),x=>x.hard)||has(A(s.date,1),x=>x.hard)))W.push({sid:s.id,msg:'Leg work next to a hard run'});
  if(s.hard&&(has(A(s.date,1),x=>x.hard)))W.push({sid:s.id,msg:'Two hard runs back to back'})});

function generate(p){p=norm(p);const g=p.goals,pid=hash(JSON.stringify([p,0])),sessions=[],weeks=[],iss=[],why=[],assume=[];

 for(let w=0;w<p.weeks;w++){const ws=A(p.start,w*7),x=rw&&rw.out[w],rec=x?x.rec:w%4===3&&w<p.weeks-1;let items=[];

  const ss=r.out.sort((a,b)=>a.date<b.date?-1:1);ss.forEach(s=>{s.id='w'+w+s.key;s.week=w;s.why=reason(s,p)});
  sessions.push(...ss);const km=R(ss.filter(s=>s.disc==='run').reduce((a,b)=>a+b.km,0),.5);
  weeks.push({n:w+1,km,mins:ss.reduce((a,b)=>a+b.mins,0),rec:!!rec,tap:!!(x&&x.tap),mod:!!(x&&x.mod),count:ss.length})}
 const plan={id:pid,name:Object.entries(g).map(([d,k])=>(d==='run'?RG:d==='str'?SG:CG)[k].n).join(' + '),start:p.start,end:A(p.start,p.weeks*7-1),weeks,sessions,issues:iss,why,assume};
 if(rw){why.push(`Running starts at ${rw.out[0].km} km a week (${p.interrupted?'60% of your pre-break':'about 95% of your recent'} ${rw.base} km) and rises about ${Math.round(rw.pct*100)}% a week, with a lighter week every fourth.`);
  const Ls=rw.out.filter(o=>!o.rec&&!o.tap).map(o=>o.L);why.push(`Long runs sit on ${DN[p.longDay]} and grow from ${rw.out[0].L} to ${Math.max(...Ls)} km, never more than 2 km above your longest recent run.`);
  why.push(p.run.exp<1?'No hard sessions yet: this block builds aerobic base with run/walk and easy running.':`${Math.min(p.run.q,p.run.freq>=2?2:0)===1?'One':'Up to two'} quality session${p.run.q===1?'':'s'} a week, as you asked, kept off the days next to your long run.`);
  assume.push(`Easy pace is assumed at ${PACE[p.run.exp]} min/km from your experience level. Edit your runs to change it.`)}
 const lowerDays=sessions.filter(s=>s.week===Math.min(1,p.weeks-1)&&s.lower).map(s=>DN[WD(s.date)]);

function validate(p,plan){const f=[],P=norm(p),pl2=generate(p);if(JSON.stringify(plan)!==JSON.stringify(pl2))f.push('not deterministic');

  if(!plan.sessions.some(s=>s.cls==='long')&&P.run.freq>1&&P.days.length>1)f.push('no long run')}
 plan.weeks.forEach((w,i)=>{const want=(P.goals.run?Math.min(P.run.freq,P.days.length):0)+(P.goals.str?P.str.freq:0)+(P.goals.cal?P.cal.freq:0),got=plan.sessions.filter(s=>s.week===i).length;if(got<want&&!plan.issues.length&&i>0)f.push('missing workouts week '+(i+1)+' without explanation')});

const bw=k=>historyWorkouts(k)[0]||null;
const wkTot=()=>wkDays().filter(k=>bw(k)).length,wkDone=()=>wkDays().filter(k=>k<TODAY&&bw(k)).length;
const GL={run:'<svg class="gly" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12l4-4 2.5 2.5L14 4.5M10 4h4v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',str:'<svg class="gly" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6v4M5 4.5v7M11 4.5v7M13.5 6v4M5 8h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',cal:'<svg class="gly" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M5 3v3M11 3v3M8 7v3.5M5.5 14.5L8 10.5l2.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'};

/* Phase 4D.1: week status counts sessions the person actually logged against the scheduled workout, not elapsed days. */
const dayOf=ts=>{const d=new Date(+ts);return isNaN(d)?null:iso(d)};
const loggedOn=k=>historyWorkouts(k).length>0&&historyWorkouts(k).every(id=>sessionLogged(id,k));
function wkStats(){const ds=wkDays(),refs=ds.flatMap(k=>historyWorkouts(k).map(id=>({k,id}))),by={run:0,str:0,cal:0};refs.forEach(x=>by[W[x.id].t]++);return{ds,pl:refs.map(x=>x.k),by,done:refs.filter(x=>sessionLogged(x.id,x.k)).map(x=>x.k),open:refs.filter(x=>x.k<TODAY&&!sessionLogged(x.id,x.k)).map(x=>x.k)}}
const dayState=k=>{const x=W[bw(k)];return !x?'off':loggedOn(k)?'done':k<TODAY?'miss':k===TODAY?'today':'next'};
function ring(){const st=wkStats(),C=2*Math.PI*48,seg=C/7;return'<svg viewBox="0 0 120 120" width="112" height="112" role="img" aria-label="Week progress: '+st.done.length+' of '+st.pl.length+' planned sessions logged">'+st.ds.map((k,i)=>{const x=W[bw(k)],q=dayState(k);const col=x?`var(--${x.t})`:'var(--s3)';return`<circle cx="60" cy="60" r="48" fill="none" stroke="${col}" stroke-width="${k===TODAY?12:8}" stroke-linecap="round" stroke-dasharray="${seg-9} ${C}" stroke-dashoffset="${-i*seg}" opacity="${q==='done'||q==='today'?1:q==='next'?.45:.2}" transform="rotate(-90 60 60)"/>`}).join('')+`<text x="60" y="68" text-anchor="middle" fill="#f4f1ea" font-family="Bricolage Grotesque,system-ui" font-weight="800" font-size="26">${st.done.length}/${st.pl.length}</text></svg>`}
const INTENT={r1:'Hold the threshold reps hard but controlled, and keep the warm-up and cooldown easy.',r2:'Keep the long run conversational and finish with energy left.',r3:'Keep it easy. If it starts to feel like effort, slow down.',s1:'Add the 2.5 kg only if every rep stays controlled.',c1:'Quality over volume: stop each set before form breaks.'};
const intent=id=>INTENT[id]||({run:'Match the effort to the session and run it by feel.',str:'Keep reps controlled and add load only when every rep stays clean.',cal:'Quality over volume: stop each set before form breaks.'})[W[id].t];
function today(){const k=TODAY,id=wid(k),w=W[id]||null,nx=[1,2,3,4,5,6,7].map(i=>add(k,i)).find(x=>wid(x));const nw=nx&&W[wid(nx)],st=wkStats();
const hero=w?`<div class="hero ${w.t}" style="--c:var(--${w.t})"><span class="tag">${GL[w.t]}${TY[w.t]} · ${w.m} min</span><div class="big">${w.n}</div><p class="sm why">${w.why}</p>${struct(id,'hero')}<div class="row"><button class="btn" data-a="start" data-v="${id}">Start</button><button class="btn g" data-a="open" data-v="${id}|${k}">Preview</button></div></div>`:`<div class="hero off" style="--c:var(--ok)"><span class="tag">Rest day</span><div class="big">Nothing planned</div><p class="sm why">${nw?`Recovery is part of the plan. Next up is ${nw.n}, ${fmt(nx)}.`:'Recovery is part of the plan.'}</p>${nw?`<div class="row"><button class="btn g" data-a="open" data-v="${wid(nx)}|${nx}">Preview next session</button></div>`:''}</div>`;
const parts=[['run','run'],['str','strength'],['cal','calisthenics']].filter(([t])=>st.by[t]).map(([t,n])=>`${st.by[t]} ${n}`);
const strip=`<ol class="wkdots" aria-label="This week by day">${st.ds.map(k=>{const x=W[bw(k)],q=dayState(k),lbl={off:'rest day',done:'logged',miss:'not logged',today:'today',next:'planned'}[q];return`<li class="${q} ${k===TODAY?'tdy':''}" style="${x?'--c:var(--'+x.t+')':''}"><span>${DAYS[fromIso(k).getDay()]}</span><i class="pip ${q}">${x?GL[x.t]:''}</i><span class="sro">${x?TY[x.t]+', ':''}${lbl}</span></li>`}).join('')}</ol>`;
const week=`<h2>This week</h2><div class="card wkc"><div class="ringc">${ring()}<div><b class="kpi">${st.done.length} of ${st.pl.length} sessions logged</b><p class="sm mu">${parts.length?parts.join(', ')+' planned.':'No sessions planned.'}${st.open.length?` ${st.open.length} earlier ${st.open.length===1?'session has':'sessions have'} no log yet.`:''}</p></div></div>${strip}</div>`;
const rec=`<h2>Recovery</h2><div class="card demo"><div class="row sp"><b class="kpi">Recovery signals</b><span class="sample">Sample data</span></div><dl class="mx" style="margin-top:12px"><div><dt>Sleep</dt><dd>7h 40m</dd></div><div><dt>HRV</dt><dd>Steady</dd></div><div><dt>Load vs 4-wk</dt><dd>−12%</dd></div></dl><p class="sm mu">Illustrative values only. This prototype does not calculate readiness; a real score needs connected wellness data and a defined method.</p></div>`;
const coach=`<h2>Coach</h2><div class="card coach"><i class="cav" aria-hidden="true"></i><div>${w?`<p><b>Today: ${w.n}.</b> ${intent(id)}</p>`:`<p><b>Today is a rest day.</b> ${nw?`Your next session is ${nw.n}, ${fmt(nx)}. Easy walking or mobility is fine; save the hard effort for then.`:'Easy walking or mobility is fine.'}</p>`}<p class="sm mu" style="margin-top:8px">Sample insight: your easy pace is 6 seconds per km faster than four weeks ago at the same heart rate.</p><div class="row" style="margin-top:10px"><button class="chip" data-a="tab" data-v="acts">See recent runs</button></div></div></div>`;
const next=w&&nw?`<h2>Up next</h2><div class="list"><button class="${nw.t}" style="--c:var(--${nw.t})" data-a="open" data-v="${wid(nx)}|${nx}"><i class="dot"></i><span style="flex:1"><b>${nw.n}</b><br><span class="mu sm">${fmt(nx)}</span></span>›</button></div>`:'';
return`<div class="top"><div><div class="eyebrow">${fmt(k)}</div><h1>Good morning</h1></div><button class="av" data-a="menu">JK</button></div><div class="status"><span>${S.plan==='cancelled'?'No active plan':gpN()+' · '+gpWk()}</span><span>${st.done.length} of ${st.pl.length} logged this week</span></div><div class="og"><div class="ogm"><h2 class="wide">Today</h2>${hero}${dayWorkouts(k).length>1?`<h2>Also today</h2>${dayWorkouts(k).slice(1).map(id=>agendaCardsFor(id,k)).join('')}`:''}<div class="o-coach">${coach}</div><div class="o-next">${next}</div></div><div class="ogs"><div class="o-week">${week}</div><div class="o-rec">${rec}</div></div></div>`}

function training(){if(S.view==='month')return trainMonth();const m=monday(S.sel),days=[0,1,2,3,4,5,6].map(i=>add(m,i)),sk=S.sel,w=wid(sk);
let h=`<div class="top"><h1>Training</h1><div class="row"><button class="chip" data-a="view" data-v="month">Month</button><button class="chip" data-a="plan">Plan</button></div></div>
<div class="trg"><div class="trL"><div class="row sp" style="margin-bottom:8px"><button class="chip" data-a="wk" data-v="-7" aria-label="Previous week">‹</button><b>${fromIso(m).toLocaleDateString('en',{month:'short',day:'numeric'})} – ${fromIso(add(m,6)).toLocaleDateString('en',{month:'short',day:'numeric'})}</b><button class="chip" data-a="wk" data-v="7" aria-label="Next week">›</button></div>
<div class="wkw"><div class="wk">${days.map(k=>{const x=W[wid(k)];return`<button class="${k===sk?'on':''} ${k===TODAY?'tdy':''}" data-a="sel" data-v="${k}" style="${x?'--c:var(--'+x.t+')':''}"><span class="sm">${DAYS[fromIso(k).getDay()]}</span><b>${fromIso(k).getDate()}</b><i class="dot" style="${x?'':'opacity:0'}"></i></button>`}).join('')}</div></div>`;
h+=planCard();if(S.plan==='paused')h+=`<div class="card" style="margin-top:16px"><b>Plan paused</b><p class="sm mu">Sessions are on hold. Completed history stays.</p></div>`;
h+=`</div><div class="trR"><h2>${fmt(sk)}</h2>`;
h+=S.plan==='cancelled'?`<div class="card"><b>No active plan</b><button class="btn" data-a="plan">Create plan</button></div>`:dayWorkouts(sk).length?agendaCards(sk):`<div class="card mu">Rest day. Tap a workout day, or move a session here.</div>`;
return h+'</div></div>'}

function trainMonth(){const d=fromIso(S.sel),y=d.getFullYear(),mo=d.getMonth(),lead=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate();let c='';for(let i=0;i<lead;i++)c+='<i></i>';
for(let day=1;day<=n;day++){const k=iso(new Date(y,mo,day)),x=W[wid(k)];c+=`<button class="${k===S.sel?'on':''} ${k===TODAY?'tdy':''}" data-a="sel" data-v="${k}" style="${x?'--c:var(--'+x.t+')':''}" aria-label="${k}"><b>${day}</b><i class="dot" style="${x?'':'opacity:0'}"></i></button>`}
const w=wid(S.sel),x=W[w];
return`<div class="top"><h1>Training</h1><div class="row"><button class="chip" data-a="view" data-v="week">Week</button><button class="chip" data-a="plan">Plan</button></div></div><div class="row sp" style="margin-bottom:8px"><button class="chip" data-a="mo" data-v="-1" aria-label="Previous month">‹</button><b>${d.toLocaleDateString('en',{month:'long',year:'numeric'})}</b><button class="chip" data-a="mo" data-v="1" aria-label="Next month">›</button></div><div class="calendar-scroll" tabindex="0" role="region" aria-label="Month calendar, scroll horizontally for all dates"><div class="mo mu sm">${['M','T','W','T','F','S','S'].map(q=>`<span>${q}</span>`).join('')}</div><div class="mo">${c}</div></div><h2>${fmt(S.sel)}</h2>`+(dayWorkouts(S.sel).length?agendaCards(S.sel):'<div class="card mu">Rest day.</div>')}
function tile(i,e){return`<button class="tile ${e.t}" style="--c:var(--${e.t})" data-a="ex" data-v="${i}" aria-label="${e.n}, ${TY[e.t]}, ${e.eq}${S.fav.includes(i)?', saved':''}"><span class="fav" aria-hidden="true">${S.fav.includes(i)?'★':'☆'}</span><b>${e.n}</b><span class="mu sm">${TY[e.t]} · ${e.eq}</span></button>`}

const ws4Seg=(items,act,cur,label,cls='')=>`<div class="chips sgm n${items.length} ${cls}" style="--n:${items.length}" role="group" aria-label="${label}">${items.map(([v,l])=>`<button class="chip ${cur===v?'on':''}" data-a="${act}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
function lib(){const L=S.lib;let h=`<div class="top"><h1>Library</h1></div>${ws4Seg([['ex','Exercises'],['tpl','Templates'],['fav','Saved'],['log','Sessions']],'lib',L,'Library sections')}`;
const note={ex:'Browse movements. Save them to favorites or a collection.',tpl:'Templates are reusable plans for a session. They are not logged workouts.',fav:'Your saved exercises and collections.',log:'Completed sessions. Logged once, never edited by templates.'}[L];h+=`<p class="sm mu" style="margin:8px 0 12px">${note}</p>`;
if(L==='ex'){h+=`<input class="q" placeholder="Search exercises" value="${S.q.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" data-a="q"><div style="margin:8px 0">${ws4Seg(['all','run','str','cal'].map(t=>[t,t==='all'?'All':TY[t]]),'f',S.f,'Exercise category')}</div><div class="grid2">`;
const rs=Object.entries(E).filter(([i,e])=>(S.f==='all'||e.t===S.f)&&(e.n+' '+e.eq+' '+TY[e.t]).toLowerCase().includes(S.q.trim().toLowerCase()));rs.forEach(([i,e])=>h+=tile(i,e));h+='</div>';if(!rs.length)h+='<div class="card" style="margin-top:10px"><b>No exercises match</b><p class="sm mu">'+(S.f==='run'&&!S.q.trim()?'There are no running exercises in the library yet. Running sessions are in Training and Activities.':'Try a shorter search, or set the discipline filter to All.')+'</p></div>'}

if(L==='log'){const L2=Object.entries(S.log).sort((a,b)=>+b[0]-+a[0]);h+=L2.length?`<div class="list">${L2.map(([k,v])=>`<div><b>${v.n}</b><span class="mu sm" style="margin-left:auto">${+k>1e11?new Date(+k).toLocaleDateString('en',{month:'short',day:'numeric'})+' · ':''}${v.m||v.sets+(v.sets===1?' set':' sets')+' · '+v.vol+' kg'}</span></div>`).join('')}</div>`:`<div class="card"><b>No sessions logged here yet</b><p class="sm mu">Finish a workout from Today and it appears here.</p></div>`}
return h}
const exRow=(i,e)=>`<button class="${e.t}" style="--c:var(--${e.t})" data-a="ex" data-v="${i}"><i class="dot"></i><span style="flex:1"><b>${e.n}</b><br><span class="mu sm">${TY[e.t]} · ${e.eq}</span></span><span class="fav">${S.fav.includes(i)?'★':'☆'}</span></button>`;

function runMin(w){const g=t=>{const m=/(\d+)\s*min/.exec(t||'');return m?+m[1]:null},a=g(w.steps[0][1]),c=g(w.steps[2][1]);if(a==null||c==null||a+c>=w.m)return[['Warm-up',Math.round(w.m*.2),1],['Main set',Math.round(w.m*.6),1],['Cooldown',Math.round(w.m*.2),1]];return[['Warm-up',a,0],['Main set',w.m-a-c,1],['Cooldown',c,0]]}

const elev=()=>`<b>Elevation</b><svg viewBox="0 0 160 60" style="width:100%;margin:8px 0 6px" role="img" aria-label="Elevation profile (mock)"><defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb4ff" stop-opacity=".5"/><stop offset="1" stop-color="#6fb4ff" stop-opacity="0"/></linearGradient></defs><path d="M0 44C20 40 30 22 55 26S95 48 115 30 150 14 160 18V60H0Z" fill="url(#eg)"/><path d="M0 44C20 40 30 22 55 26S95 48 115 30 150 14 160 18" fill="none" stroke="#6fb4ff" stroke-width="2" stroke-linecap="round" pathLength="1" class="draw"/></svg><p class="sm mu" style="margin-bottom:14px">+64 m climbed · mock data</p>`;

<div style="margin:12px 0">${w.steps.map((x,i)=>`<div class="ls ${i===q.step?'c':''}"><i class="dot"></i><span><b>${x[0]}</b><br><span class="mu sm">${x[1]}</span></span></div>`).join('')}</div>

/* ---------- Phase 4D.3A: descriptive run intelligence ---------- */
function ri3(r){
  // Demo-only, descriptive analysis. Never infer unrecorded training zones, fitness,
  // aerobic decoupling, real routes, or population benchmarks from split samples.
  if(!r||!Array.isArray(r.sp)||!Array.isArray(r.d))return null;
  const complete=r.sp.map((v,i)=>({v,i,d:r.d[i]})).filter(q=>Number.isFinite(q.v)&&q.v>0&&Number.isFinite(q.d)&&q.d>=.999&&q.d<=1.001);
  if(complete.length<3)return null;
  const avg=a=>a.reduce((n,x)=>n+x.v,0)/a.length;
  const n=Math.floor(complete.length/2),early=avg(complete.slice(0,n)),late=avg(complete.slice(-n));
  const shift=Math.round(late-early),spread=Math.round(Math.max(...complete.map(x=>x.v))-Math.min(...complete.map(x=>x.v)));
  const timing=shift<=-9?'quicker':shift>=9?'slower':'similar';
  const lead=timing==='similar'?`Pacing remained relatively even across the early and late full-kilometre splits (${Math.abs(shift)} s/km difference between their averages).`:
    `The late full-kilometre splits averaged ${Math.abs(shift)} s/km ${timing} than the early splits.`;
  const excluded=r.sp.length-complete.length;
  const details=[
    `Split consistency: the full-kilometre pace range was ${spread} seconds per kilometre across ${complete.length} comparable samples.${excluded?` ${excluded} partial or non-standard split${excluded===1?' was':'s were'} excluded from this comparison, because shorter distances are not like-for-like kilometre observations.`:''} This describes the observed pace pattern, not whether the effort matched the workout's intended purpose.`
  ];
  const name=(CUR&&CUR.n||'').toLowerCase(),easy=/easy|long|recovery/.test(name),quality=/tempo|threshold|interval|speed|repetition/.test(name);
  if(Array.isArray(r.hrs)&&r.hrs.length===r.sp.length&&complete.every(q=>Number.isFinite(r.hrs[q.i]))){
    const hr0=Math.round(r.hrs[complete[0].i]),hr1=Math.round(r.hrs[complete[complete.length-1].i]);
    const change=hr1-hr0;
    details.push(`Effort context: recorded average heart rate went from ${hr0} to ${hr1} bpm across the first and last complete kilometre (${change>=0?'+':''}${change} bpm). Pace and heart rate changed together, so this does not isolate aerobic drift: heat, hills, warm-up and intentional effort changes are not controlled for.`);
  }else details.push('Effort context: comparable per-split heart-rate readings are unavailable. No heart-rate drift or effort-zone conclusion can be drawn.');
  if(Array.isArray(r.cad)&&r.cad.length===r.sp.length&&complete.every(q=>Number.isFinite(r.cad[q.i]))){
    const vals=complete.map(q=>r.cad[q.i]);
    details.push(`Rhythm: recorded cadence across complete kilometres ranged from ${Math.min(...vals)} to ${Math.max(...vals)} steps per minute. Cadence by itself is not a form score or a target to force.`);
  }
  const advice=easy?(shift<-9?'If this was intended as an easy or long run, check whether the quicker finish remained conversational rather than letting the session become an unplanned workout.':'For a similar easy or long run, prioritize a conversational effort; a steadier pace is useful only when terrain and conditions are comparable.'):
    quality?(shift>9?'For a comparable quality session, consider whether early pacing or recovery left enough room to sustain the planned effort.':'For a comparable quality session, use your workout goal to decide whether an even or progressive pattern was intended, rather than treating the fastest split as the only success.'):
    'For the next comparable session, review how the changes in pace relate to the intended effort, terrain and conditions before changing training.';
  details.push('Next comparison: '+advice);
  const prior=Phase4D.historical(r);if(prior)details.push('Previous comparable activity: '+prior);details.push(r.source==='imported'?'Limits: imported values are user-supplied and unverified. Without matched routes, weather, personal threshold calibration and independent population reference data, no aerobic drift or competitive ranking can be established.':'Limits: these are simulated per-split prototype readings, not an imported activity. There are no matched historical runs, calibrated personal zones, weather data or verified recreational/elite benchmarks available for a valid comparison.');
  return{summary:lead,details};
}

   A MutationObserver derives the state from the DOM, so nested/replaced sheets never unlock/relock between each other. */

const sync=()=>overlays().length?lock():unlock();
const mo=new MutationObserver(sync);
mo.observe(body,{childList:true});
mo.observe(document.getElementById('layer'),{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
sync();

/* nearest vertically scrollable ancestor that can actually scroll; null if none (gesture would only move the page) */

document.addEventListener('touchmove',e=>{
 const t=e.touches[0],dy=t.clientY-ly,dx=t.clientX-lx;ly=t.clientY;lx=t.clientX;
 if(!on||!e.cancelable||e.touches.length>1||Math.abs(dx)>Math.abs(dy)||!dy||ownsGesture(e.target))return;
 const s=scroller(e.target);
 if(!s||atEdge(s,dy))e.preventDefault();
},{passive:false,capture:true});
/* An interrupted touch must not leave a half-dragged sheet behind. */
document.addEventListener('touchcancel',()=>document.querySelectorAll('.sh').forEach(s=>{s.style.transition='transform .2s';s.style.transform=''}),{passive:true});
document.addEventListener('wheel',e=>{
 if(!on||e.ctrlKey||e.defaultPrevented)return;
 const s=scroller(e.target);
 if(!s||atEdge(s,-e.deltaY))e.preventDefault();
},{passive:false});
/* Scroll keys while focus sits outside the modal must not move the page; hand focus to the modal instead. */
const KEYS=new Set(['PageUp','PageDown','Home','End',' ','Spacebar','ArrowUp','ArrowDown']);
document.addEventListener('keydown',e=>{
 if(!on||!KEYS.has(e.key)||e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey)return;
 const o=overlays().pop(),a=document.activeElement;if(!o||(a&&a!==body&&o.contains(a)))return;
 e.preventDefault();const d=o.matches('[role=dialog]')?o:o.querySelector('[role=dialog]')||o;d.tabIndex=-1;d.focus({preventScroll:true});
},true);
})();
</script>
